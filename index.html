<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>永隆工程股份有限公司 - 不符合及矯正措施單</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        apple: {
                            bg: '#F5F5F7',
                            card: '#FFFFFF',
                            border: '#D2D2D7',
                            text: '#1D1D1F',
                            muted: '#86868B',
                            accent: '#0071E3',
                            accentHover: '#0077ED',
                            subtle: '#F2F2F7'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-apple-bg text-apple-text font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- 頂部導覽列 -->
    <header class="bg-white/80 backdrop-blur-md border-b border-apple-border sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-apple-accent flex items-center justify-center text-white font-bold text-sm">
                    PA
                </div>
                <div>
                    <h1 class="text-sm font-semibold text-apple-text">永隆工程股份有限公司</h1>
                    <p class="text-xs text-apple-muted">不符合及矯正措施單系統 (PA-21)</p>
                </div>
            </div>
            <!-- 頁籤按鈕 -->
            <nav class="flex space-x-1 bg-apple-subtle p-1 rounded-xl text-sm" id="tabNav">
                <button onclick="switchTab('create')" class="tab-btn px-4 py-1.5 rounded-lg font-medium transition-all text-apple-accent bg-white shadow-sm" data-target="create">新增單號</button>
                <button onclick="switchTab('corrective')" class="tab-btn px-4 py-1.5 rounded-lg font-medium transition-all text-apple-muted hover:text-apple-text" data-target="corrective">矯正措施</button>
                <button onclick="switchTab('result')" class="tab-btn px-4 py-1.5 rounded-lg font-medium transition-all text-apple-muted hover:text-apple-text" data-target="result">成果內容</button>
                <button onclick="switchTab('history')" class="tab-btn px-4 py-1.5 rounded-lg font-medium transition-all text-apple-muted hover:text-apple-text" data-target="history">歷史單據</button>
            </nav>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-6xl mx-auto px-6 py-8 flex-grow w-full">
        
        <!-- 1. 新增單號 -->
        <section id="tab-create" class="tab-content space-y-6">
            <div class="bg-apple-card rounded-2xl p-8 border border-apple-border shadow-sm">
                <div class="border-b border-apple-border pb-4 mb-6">
                    <h2 class="text-lg font-semibold text-apple-text">建立不符合及矯正措施單</h2>
                    <p class="text-xs text-apple-muted mt-1">表單編號：PA-21 · 202001V03</p>
                </div>
                <form id="createForm" onsubmit="submitForm(event)" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-xs font-medium text-apple-muted mb-2">填表日期</label>
                            <input type="date" id="formDate" required class="w-full bg-apple-subtle border border-apple-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-apple-accent">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-apple-muted mb-2">單號 (自動產生)</label>
                            <input type="text" id="formId" readonly class="w-full bg-apple-subtle border border-apple-border rounded-xl px-4 py-2.5 text-sm text-apple-muted cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-apple-muted mb-2">受檢單位 / 部門</label>
                            <input type="text" id="department" required placeholder="請輸入部門名稱" class="w-full bg-apple-subtle border border-apple-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-apple-accent">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-apple-muted mb-2">不符合事實描述</label>
                        <textarea id="description" rows="4" required placeholder="請詳細描述不符合事項..." class="w-full bg-apple-subtle border border-apple-border rounded-xl p-4 text-sm focus:outline-none focus:border-apple-accent"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-apple-border">
                        <button type="reset" class="px-5 py-2.5 rounded-xl border border-apple-border text-sm font-medium text-apple-muted hover:bg-apple-subtle transition-all">重設</button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-800 text-white text-sm font-medium transition-all shadow-sm">送出單據</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- 2. 矯正措施 -->
        <section id="tab-corrective" class="tab-content hidden space-y-6">
            <div class="bg-apple-card rounded-2xl p-8 border border-apple-border shadow-sm">
                <div class="border-b border-apple-border pb-4 mb-6">
                    <h2 class="text-lg font-semibold text-apple-text">矯正與預防措施填報</h2>
                    <p class="text-xs text-apple-muted mt-1">針對已立案之單據填寫原因分析與改善對策</p>
                </div>
                <div class="space-y-6">
                    <div>
                        <label class="block text-xs font-medium text-apple-muted mb-2">選擇要處理的單號</label>
                        <select id="correctiveSelect" onchange="loadCorrectiveData()" class="w-full bg-apple-subtle border border-apple-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-apple-accent">
                            <option value="">請選擇單號...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-apple-muted mb-2">原因分析</label>
                        <textarea id="rootCause" rows="3" placeholder="請填寫根本原因分析..." class="w-full bg-apple-subtle border border-apple-border rounded-xl p-4 text-sm focus:outline-none focus:border-apple-accent"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-apple-muted mb-2">矯正措施與預防對策</label>
                        <textarea id="correctiveAction" rows="3" placeholder="請填寫具體矯正措施..." class="w-full bg-apple-subtle border border-apple-border rounded-xl p-4 text-sm focus:outline-none focus:border-apple-accent"></textarea>
                    </div>
                    <div class="flex justify-end pt-4 border-t border-apple-border">
                        <button onclick="saveCorrective()" class="px-5 py-2.5 rounded-xl bg-slate-600 hover:bg-slate-700 text-white text-sm font-medium transition-all shadow-sm">儲存矯正措施</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. 成果內容 -->
        <section id="tab-result" class="tab-content hidden space-y-6">
            <div class="bg-apple-card rounded-2xl p-8 border border-apple-border shadow-sm">
                <div class="border-b border-apple-border pb-4 mb-6">
                    <h2 class="text-lg font-semibold text-apple-text">改善成果與驗證填報</h2>
                    <p class="text-xs text-apple-muted mt-1">確認實施成效並進行結案驗證</p>
                </div>
                <div class="space-y-6">
                    <div>
                        <label class="block text-xs font-medium text-apple-muted mb-2">選擇要驗證的單號</label>
                        <select id="resultSelect" onchange="loadResultData()" class="w-full bg-apple-subtle border border-apple-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-apple-accent">
                            <option value="">請選擇單號...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-apple-muted mb-2">改善成果說明</label>
                        <textarea id="resultDesc" rows="3" placeholder="請說明改善後的實際成果..." class="w-full bg-apple-subtle border border-apple-border rounded-xl p-4 text-sm focus:outline-none focus:border-apple-accent"></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-medium text-apple-muted mb-2">驗證結果</label>
                            <select id="verifyStatus" class="w-full bg-apple-subtle border border-apple-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-apple-accent">
                                <option value="有效">有效結案</option>
                                <option value="需追蹤">需追蹤複查</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-apple-muted mb-2">驗證人員</label>
                            <input type="text" id="verifier" placeholder="請輸入驗證人姓名" class="w-full bg-apple-subtle border border-apple-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-apple-accent">
                        </div>
                    </div>
                    <div class="flex justify-end pt-4 border-t border-apple-border">
                        <button onclick="saveResult()" class="px-5 py-2.5 rounded-xl bg-slate-600 hover:bg-slate-700 text-white text-sm font-medium transition-all shadow-sm">完成驗證並結案</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. 歷史單據 -->
        <section id="tab-history" class="tab-content hidden space-y-6">
            <div class="bg-apple-card rounded-2xl p-8 border border-apple-border shadow-sm">
                <div class="border-b border-apple-border pb-4 mb-6 flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-semibold text-apple-text">歷史單據列表</h2>
                        <p class="text-xs text-apple-muted mt-1">查詢所有矯正措施單與目前進度</p>
                    </div>
                    <button onclick="loadHistory()" class="px-4 py-2 rounded-xl border border-apple-border text-xs font-medium text-apple-muted hover:bg-apple-subtle transition-all flex items-center space-x-1.5">
                        <i class="fa-solid fa-rotate"></i>
                        <span>重新整理</span>
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-apple-border text-apple-muted text-xs">
                                <th class="pb-3 font-medium">單號</th>
                                <th class="pb-3 font-medium">填表日期</th>
                                <th class="pb-3 font-medium">受檢單位</th>
                                <th class="pb-3 font-medium">目前階段</th>
                                <th class="pb-3 font-medium text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="divide-y divide-apple-border/50">
                            <!-- 動態載入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- 單據詳情 Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-apple-card rounded-2xl max-w-2xl w-full p-8 border border-apple-border shadow-xl space-y-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-apple-border pb-4">
                <div>
                    <h3 class="text-lg font-semibold text-apple-text" id="modalTitle">單據詳情</h3>
                    <p class="text-xs text-apple-muted" id="modalSub">PA-21 矯正措施單</p>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-apple-subtle flex items-center justify-center text-apple-muted hover:text-apple-text">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- 橫向簡化進度條 -->
            <div class="bg-apple-subtle p-4 rounded-xl">
                <p class="text-xs font-medium text-apple-muted mb-3">目前執行進度</p>
                <div class="flex items-center justify-between relative" id="modalProgressBar">
                    <!-- 動態進度條 -->
                </div>
            </div>

            <div class="space-y-4 text-sm" id="modalBodyContent">
                <!-- 詳細資料 -->
            </div>

            <div class="flex justify-end pt-4 border-t border-apple-border">
                <button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-slate-600 hover:bg-slate-700 text-white text-sm font-medium transition-all">關閉視窗</button>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="text-center py-6 text-xs text-apple-muted border-t border-apple-border bg-white/40">
        &copy; 2026 永隆工程股份有限公司 All Rights Reserved.
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        // 模擬本機資料庫 (LocalStorage) 支援無縫測試
        let mockDB = JSON.parse(localStorage.getItem('PA21_DB')) || [
            { id: 'PA-202604-001', date: '2026-04-01', dept: '機械課', desc: '公務車大燈殼破損未即時更新紀錄', stage: 1, rootCause: '', action: '', result: '', status: '', verifier: '' },
            { id: 'PA-202604-002', date: '2026-04-05', dept: '品保課', desc: '巡檢表單欄位數據對齊異常', stage: 2, rootCause: '未依最新格式規範填寫', action: '已重新修正範本並宣導', result: '', status: '', verifier: '' }
        ];

        function saveData() {
            localStorage.setItem('PA21_DB', JSON.stringify(mockDB));
        }

        // 初始化自動產生單號與日期
        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('formDate').value = today;
            document.getElementById('formId').value = 'PA-' + new Date().toISOString().slice(0,7).replace('-','') + '-' + String(Math.floor(Math.random() * 900) + 100);
            updateSelectOptions();
            loadHistory();
        };

        // 切換頁籤
        function switchTab(target) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + target).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-apple-accent', 'bg-white', 'shadow-sm');
                btn.classList.add('text-apple-muted');
                if(btn.dataset.target === target) {
                    btn.classList.add('text-apple-accent', 'bg-white', 'shadow-sm');
                    btn.classList.remove('text-apple-muted');
                }
            });

            if(target === 'corrective' || target === 'result') {
                updateSelectOptions();
            } else if(target === 'history') {
                loadHistory();
            }
        }

        // 更新下拉選單
        function updateSelectOptions() {
            const corrSelect = document.getElementById('correctiveSelect');
            const resSelect = document.getElementById('resultSelect');
            
            corrSelect.innerHTML = '<option value="">請選擇單號...</option>';
            resSelect.innerHTML = '<option value="">請選擇單號...</option>';

            mockDB.forEach(item => {
                corrSelect.innerHTML += `<option value="${item.id}">${item.id} - ${item.dept}</option>`;
                resSelect.innerHTML += `<option value="${item.id}">${item.id} - ${item.dept}</option>`;
            });
        }

        // 提交表單
        function formSubmit(e) {
            e.preventDefault();
        }
        function submitForm(event) {
            event.preventDefault();
            const newItem = {
                id: document.getElementById('formId').value,
                date: document.getElementById('formDate').value,
                dept: document.getElementById('department').value,
                desc: document.getElementById('description').value,
                stage: 1,
                rootCause: '', action: '', result: '', status: '', verifier: ''
            };
            mockDB.unshift(newItem);
            saveData();
            alert('單號建立成功！');
            document.getElementById('createForm').reset();
            window.onload();
            switchTab('history');
        }

        // 載入矯正措施資料
        function loadCorrectiveData() {
            const id = document.getElementById('correctiveSelect').value;
            const item = mockDB.find(d => d.id === id);
            if(item) {
                document.getElementById('rootCause').value = item.rootCause || '';
                document.getElementById('correctiveAction').value = item.action || '';
            }
        }

        // 儲存矯正措施
        function saveCorrective() {
            const id = document.getElementById('correctiveSelect').value;
            if(!id) { alert('請先選擇單號'); return; }
            const item = mockDB.find(d => d.id === id);
            if(item) {
                item.rootCause = document.getElementById('rootCause').value;
                item.action = document.getElementById('correctiveAction').value;
                item.stage = 2; // 進階到成果階段
                saveData();
                alert('矯正措施已成功儲存！');
                switchTab('history');
            }
        }

        // 載入成果內容資料
        function loadResultData() {
            const id = document.getElementById('resultSelect').value;
            const item = mockDB.find(d => d.id === id);
            if(item) {
                document.getElementById('resultDesc').value = item.result || '';
                document.getElementById('verifier').value = item.verifier || '';
            }
        }

        // 儲存成果
        function saveResult() {
            const id = document.getElementById('resultSelect').value;
            if(!id) { alert('請先選擇單號'); return; }
            const item = mockDB.find(d => d.id === id);
            if(item) {
                item.result = document.getElementById('resultDesc').value;
                item.status = document.getElementById('verifyStatus').value;
                item.verifier = document.getElementById('verifier').value;
                item.stage = 3; // 結案驗證
                saveData();
                alert('成果驗證與結案完成！');
                switchTab('history');
            }
        }

        // 載入歷史列表
        function loadHistory() {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            if(mockDB.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-apple-muted">目前尚無歷史單據紀錄</td></tr>`;
                return;
            }

            const stageNames = ['1. 建立單號', '2. 填報矯正', '3. 驗證結案'];

            mockDB.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-apple-subtle/50 transition-all">
                        <td class="py-3.5 font-medium text-apple-text">${item.id}</td>
                        <td class="py-3.5 text-apple-muted">${item.date}</td>
                        <td class="py-3.5 text-apple-text">${item.dept}</td>
                        <td class="py-3.5">
                            <span class="px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-700">
                                ${stageNames[item.stage - 1] || '處理中'}
                            </span>
                        </td>
                        <td class="py-3.5 text-right">
                            <button onclick="viewDetail('${item.id}')" class="px-3 py-1.5 rounded-lg border border-apple-border text-xs font-medium text-apple-muted hover:text-apple-text hover:bg-apple-subtle transition-all">查看詳情</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 查看詳情 Modal
        function viewDetail(id) {
            const item = mockDB.find(d => d.id === id);
            if(!item) return;

            document.getElementById('modalTitle').innerText = `單號：${item.id}`;
            document.getElementById('modalSub').innerText = `受檢單位：${item.dept} | 填表日期：${item.date}`;

            // 繪製橫向進度條
            const barContainer = document.getElementById('modalProgressBar');
            const stages = ['建立單號', '矯正措施', '成果結案'];
            let barHtml = '';
            stages.forEach((name, idx) => {
                const stepNum = idx + 1;
                const isCompleted = item.stage >= stepNum;
                const activeClass = isCompleted ? 'bg-slate-700 text-white' : 'bg-apple-border text-apple-muted';
                barHtml += `
                    <div class="flex flex-col items-center z-10">
                        <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-semibold ${activeClass}">${stepNum}</div>
                        <span class="text-xs mt-1.5 text-apple-muted">${name}</span>
                    </div>
                `;
            });
            barContainer.innerHTML = barHtml;

            // 填充內容
            document.getElementById('modalBodyContent').innerHTML = `
                <div class="space-y-3">
                    <div class="bg-apple-subtle p-3.5 rounded-xl">
                        <span class="text-xs font-medium text-apple-muted block mb-1">不符合事實描述</span>
                        <p class="text-apple-text">${item.desc || '無'}</p>
                    </div>
                    <div class="bg-apple-subtle p-3.5 rounded-xl">
                        <span class="text-xs font-medium text-apple-muted block mb-1">原因分析與矯正對策</span>
                        <p class="text-apple-text"><strong>原因：</strong>${item.rootCause || '尚未填寫'}</p>
                        <p class="text-apple-text mt-1"><strong>對策：</strong>${item.action || '尚未填寫'}</p>
                    </div>
                    <div class="bg-apple-subtle p-3.5 rounded-xl">
                        <span class="text-xs font-medium text-apple-muted block mb-1">改善成果與驗證</span>
                        <p class="text-apple-text"><strong>成果：</strong>${item.result || '尚未填寫'}</p>
                        <p class="text-apple-text mt-1"><strong>狀態：</strong>${item.status || '處理中'} (驗證人：${item.verifier || '無'})</p>
                    </div>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
        }
    </script>
</body>
</html>
