<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不符合及矯正措施單 (NCR)</title>
    <!-- 引入 Apple 風格字型與簡約樣式 -->
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --accent-color: #0071e3;
            --accent-hover: #0077ed;
            --border-color: #d2d2d7;
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            padding: 40px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.003em;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input[type="text"], 
        textarea, 
        select {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            color: var(--text-main);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input[type="text"]:focus, 
        textarea:focus, 
        select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.12);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 12px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .status-msg {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            color: #34c759;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>不符合及矯正措施單</h2>
        <div class="subtitle">表號: PA-21 202001V03</div>

        <form id="ncrForm">
            <div class="form-group">
                <label for="formNo">表單編號 / 記錄名稱</label>
                <input type="text" id="formNo" value="PA-21" required>
            </div>

            <div class="form-group">
                <label for="issueDesc">不符合事項描述</label>
                <textarea id="issueDesc" placeholder="請詳細描述發生之不符合狀況..." required></textarea>
            </div>

            <div class="form-group">
                <label for="rootCause">原因分析</label>
                <textarea id="rootCause" placeholder="請填寫根本原因分析..." required></textarea>
            </div>

            <div class="form-group">
                <label for="corrections">矯正及預防措施</label>
                <textarea id="corrections" placeholder="請填寫因應的矯正與預防措施..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">送出資料</button>
            <div id="statusMsg" class="status-msg">資料已成功送出並儲存至 Firebase！</div>
        </form>
    </div>

    <!-- 引入 Firebase SDK (採用現代 ES Module 寫法) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // TODO: 請替換成你在 Firebase 專案設定中取得的設定碼
        const firebaseConfig = {
  apiKey: "AIzaSyCVAyuGB1Nqr1QuTBgDN5tC-CHReCb3Xrc",
  authDomain: "ncr-system-e64b0.firebaseapp.com",
  projectId: "ncr-system-e64b0",
  storageBucket: "ncr-system-e64b0.firebasestorage.app",
  messagingSenderId: "1021343354838",
  appId: "1:1021343354838:web:0f4bf278f50b484e6fde77",
  measurementId: "G-C37BSH2ZEB"
};

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('ncrForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = '傳送中...';

            const formData = {
                formNo: document.getElementById('formNo').value,
                issueDesc: document.getElementById('issueDesc').value,
                rootCause: document.getElementById('rootCause').value,
                corrections: document.getElementById('corrections').value,
                createdAt: new Date().toISOString()
            };

            try {
                // 將資料寫入先前建立的 records 集合（或是改成你的集合名稱）
                await addDoc(collection(db, "records"), formData);
                
                statusMsg.style.display = 'block';
                form.reset();
                setTimeout(() => {
                    statusMsg.style.display = 'none';
                }, 3000);
            } catch (error) {
                console.error("寫入錯誤：", error);
                alert("送出失敗，請檢查網路或 Firebase 設定。");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '送出資料';
            }
        });
    </script>
</body>
</html>
